<!-- Lightbox (outside site-wrap so it covers full viewport) -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lightbox-close" id="lb-close">close ✕</button>
  <button class="lightbox-nav prev" id="lb-prev" aria-label="Previous photo">‹</button>
  <img class="lightbox-img" id="lb-img" src="" alt="">
  <p class="lightbox-meta" id="lb-meta"></p>
  <button class="lightbox-nav next" id="lb-next" aria-label="Next photo">›</button>
</div>

<script src="../assets/js/main.js"></script>
<script>
(function () {
  // ── Filter ──────────────────────────────────────────
  const filterBtns = document.querySelectorAll('.photo-filter');
  const items = Array.from(document.querySelectorAll('.photo-item'));

  // Only show items that have a real (loaded) image
  const visibleItems = () => items.filter(el => el.style.display !== 'none');

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      const f = btn.dataset.filter;
      items.forEach(item => {
        item.classList.toggle('hidden', f !== 'all' && item.dataset.cat !== f);
      });
    });
  });

  // ── Lightbox ─────────────────────────────────────────
  const lb      = document.getElementById('lightbox');
  const lbImg   = document.getElementById('lb-img');
  const lbMeta  = document.getElementById('lb-meta');
  const lbClose = document.getElementById('lb-close');
  const lbPrev  = document.getElementById('lb-prev');
  const lbNext  = document.getElementById('lb-next');
  let current   = 0;

  function activeItems() {
    return items.filter(el =>
      el.style.display !== 'none' && !el.classList.contains('hidden')
    );
  }

  function openAt(idx) {
    const pool = activeItems();
    if (!pool.length) return;
    current = (idx + pool.length) % pool.length;
    const item = pool[current];
    const img  = item.querySelector('img');
    lbImg.src  = img.src;
    lbImg.alt  = img.alt;
    lbMeta.textContent = [item.dataset.title, item.dataset.info].filter(Boolean).join(' · ');
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function close() {
    lb.classList.remove('open');
    document.body.style.overflow = '';
  }

  items.forEach((item, i) => {
    item.addEventListener('click', () => {
      const pool = activeItems();
      openAt(pool.indexOf(item));
    });
  });

  lbClose.addEventListener('click', close);
  lbPrev.addEventListener('click', () => openAt(current - 1));
  lbNext.addEventListener('click', () => openAt(current + 1));

  lb.addEventListener('click', e => { if (e.target === lb) close(); });

  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape')      close();
    if (e.key === 'ArrowLeft')   openAt(current - 1);
    if (e.key === 'ArrowRight')  openAt(current + 1);
  });
})();
</script>
